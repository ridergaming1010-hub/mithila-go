spring.application.name=Mithila Go
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mithila-go;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h
server.port=${PORT:8081}
# Keep this key stable and secret; full Aadhaar numbers are not stored.
mithila.aadhaar.hmac-key=${MITHILA_AADHAAR_HMAC_KEY:}
mithila.aadhaar.hmac-key-file=${MITHILA_AADHAAR_HMAC_KEY_FILE:./data/aadhaar-hmac.key}
mithila.routing.ors-api-key=${ORS_API_KEY:}
mithila.routing.osrm-url=${OSRM_ROUTER_URL:https://router.project-osrm.org}
mithila.geocoding.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
mithila.geocoding.user-agent=${GEOCODING_USER_AGENT:MithilaGo/1.0}
mithila.dispatch.radius-km=${DRIVER_DISPATCH_RADIUS_KM:20}
# Pilot values: confirm the four non-auto rates and all minimums with local drivers before launch.
mithila.fares.bike.base=${FARE_BIKE_BASE:0}
mithila.fares.bike.rate-per-km=${FARE_BIKE_RATE_PER_KM:12}
mithila.fares.bike.minimum=${FARE_BIKE_MINIMUM:30}
mithila.fares.auto.base=${FARE_AUTO_BASE:0}
mithila.fares.auto.rate-per-km=${FARE_AUTO_RATE_PER_KM:20}
mithila.fares.auto.minimum=${FARE_AUTO_MINIMUM:30}
mithila.fares.erickshaw.base=${FARE_ERICKSHAW_BASE:0}
mithila.fares.erickshaw.rate-per-km=${FARE_ERICKSHAW_RATE_PER_KM:15}
mithila.fares.erickshaw.minimum=${FARE_ERICKSHAW_MINIMUM:30}
mithila.fares.mini.base=${FARE_MINI_BASE:0}
mithila.fares.mini.rate-per-km=${FARE_MINI_RATE_PER_KM:23}
mithila.fares.mini.minimum=${FARE_MINI_MINIMUM:50}
mithila.fares.suv.base=${FARE_SUV_BASE:0}
mithila.fares.suv.rate-per-km=${FARE_SUV_RATE_PER_KM:25}
mithila.fares.suv.minimum=${FARE_SUV_MINIMUM:80}
