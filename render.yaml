services:
  - type: web
    name: mithila-go-poc
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MITHILA_AADHAAR_HMAC_KEY
        sync: false
      - key: JPA_DDL_AUTO
        value: update
